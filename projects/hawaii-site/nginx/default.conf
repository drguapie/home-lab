server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;
        # Block access to hidden files and directories
    location ~ /\. {
        deny all;
    }

    # Block access to project configuration and backend files
    location ~ ^/(backend|nginx|secrets|uploads)/ {
        deny all;
    }

    location = /compose.yaml {
        deny all;
    }

    # Require authentication to access the admin dashboard
    location = /admin.html {
        auth_basic "Hawaii Memories Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

       location /api/ {
        # Visitors can read memories without logging in.
        # Adding, editing, or deleting requires authentication.
        limit_except GET {
            auth_basic "Hawaii Memories Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        proxy_pass http://hawaii-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
