services:
  hawaii-web:
    image: nginx:alpine
    container_name: hawaii-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro

  hawaii-api:
    build: ./backend
    container_name: hawaii-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - default
      - proxy

  hawaii-db:
    image: postgres:16
    container_name: hawaii-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hawaii_db_data:/var/lib/postgresql/data

volumes:
  hawaii_db_data:

networks:
  proxy:
    external: true
