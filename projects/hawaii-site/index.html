<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Time in Hawaii</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Our Time in Hawaii</h1>
        <p>A collection of memories from our time living on the islands.</p>
    </header>

    <main>

        <!-- Public scrapbook gallery -->
        <section>
            <h2>Memories</h2>

            <div id="memories"></div>
        </section>

    </main>

    <script>

        // Track which Polaroid is currently on top.
        let highestZIndex = 1;

        // Retrieve memories from the Flask API.
        async function loadMemories() {

            const memoriesContainer =
                document.getElementById("memories");

            try {

                const response = await fetch("/api/memories");

                if (!response.ok) {
                    throw new Error("Failed to load memories");
                }

                const data = await response.json();

                // Clear existing memories before displaying new ones.
                memoriesContainer.replaceChildren();

                data.memories.forEach(memory => {

                    // Create the Polaroid frame.
                    const memoryElement =
                        document.createElement("div");

                    memoryElement.className = "polaroid";

                    // Allow independent movement while preserving Flexbox.
                    memoryElement.style.position = "relative";

                    // Make the Polaroid keyboard accessible.
                    memoryElement.tabIndex = 0;

                    memoryElement.setAttribute("role", "button");

                    memoryElement.setAttribute(
                        "aria-label",
                        "Open memory: " + (memory.title || "Untitled Memory")
                    );


                    // ==========================================
                    // POLAROID DRAGGING FUNCTIONALITY
                    // ==========================================

                    // Track the pointer's previous position.
                    let startX = 0;
                    let startY = 0;

                    // Track the Polaroid's current position.
                    let currentX = 0;
                    let currentY = 0;

                    // Track whether the pointer is pressed.
                    let isDragging = false;

                    // Track whether movement exceeded the click threshold.
                    let hasMoved = false;

                    // Minimum movement required to count as dragging.
                    const dragThreshold = 5;


                    // Detect when someone grabs a Polaroid.
                    memoryElement.addEventListener("pointerdown", event => {

                        // Only respond to the primary mouse button.
                        if (event.pointerType === "mouse" && event.button !== 0) {
                            return;
                        }

                        startX = event.clientX;
                        startY = event.clientY;

                        isDragging = true;
                        hasMoved = false;
                        // Bring the selected photograph above every other Polaroid.
                        highestZIndex++;
                        memoryElement.style.zIndex = highestZIndex;

                        // Keep receiving events if the pointer leaves the photo.
                        memoryElement.setPointerCapture(event.pointerId);

                    });


                    // Move the Polaroid while dragging.
                    memoryElement.addEventListener("pointermove", event => {

                        if (!isDragging) {
                            return;
                        }

                        const deltaX = event.clientX - startX;
                        const deltaY = event.clientY - startY;

                        // Detect movement beyond a normal click.
                        if (
                            Math.abs(deltaX) > dragThreshold ||
                            Math.abs(deltaY) > dragThreshold
                        ) {
                            hasMoved = true;
                        }

                        // Only move after dragging has been detected.
                        if (hasMoved) {

                            currentX += deltaX;
                            currentY += deltaY;

                            memoryElement.style.left = currentX + "px";
                            memoryElement.style.top = currentY + "px";

                        }

                        // Remember the latest pointer position.
                        startX = event.clientX;
                        startY = event.clientY;

                    });


                    // Stop dragging when the pointer is released.
                    memoryElement.addEventListener("pointerup", event => {

                        isDragging = false;

                    });


                    // Handle interrupted dragging.
                    memoryElement.addEventListener("pointercancel", () => {

                        isDragging = false;
                        hasMoved = false;

                    });


                    // ==========================================
                    // POLAROID PHOTOGRAPH
                    // ==========================================

                    // Display only the photograph on the scrapbook.
                    if (memory.image_path) {

                        const photo =
                            document.createElement("img");

                        photo.src = memory.image_path;
                        photo.alt = memory.title || "Hawaii memory";
                        photo.className = "memory-image";

                        // Prevent the browser's native image dragging.
                        photo.draggable = false;

                        memoryElement.appendChild(photo);

                    } else {

                        const placeholder =
                            document.createElement("div");

                        placeholder.className = "photo-placeholder";
                        placeholder.textContent = "No photograph";

                        memoryElement.appendChild(placeholder);

                    }


                    // ==========================================
                    // OPEN EXPANDED MEMORY
                    // ==========================================

                    memoryElement.addEventListener("click", event => {

                        // Do not open the memory after dragging.
                        if (hasMoved) {

                            hasMoved = false;
                            return;

                        }

                        openMemory(memory);

                    });


                    // Allow keyboard users to open memories.
                    memoryElement.addEventListener("keydown", event => {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();
                            openMemory(memory);

                        }

                    });


                    // Add the Polaroid to the gallery.
                    memoriesContainer.appendChild(memoryElement);

                });

            } catch (error) {

                console.error("Failed to load memories:", error);

                memoriesContainer.textContent =
                    "Unable to load memories. Please try again later.";

            }
        }


        // ==========================================
        // EXPANDED MEMORY OVERLAY
        // ==========================================

        function openMemory(memory) {

            const overlay = document.createElement("div");
            overlay.className = "memory-overlay";

            const details = document.createElement("div");
            details.className = "memory-details";

            details.setAttribute("role", "dialog");
            details.setAttribute("aria-modal", "true");

            details.setAttribute(
                "aria-label",
                memory.title || "Memory details"
            );

            // Remember which element was selected before opening.
            const previousFocus = document.activeElement;


            // Create the close button.
            const closeButton = document.createElement("button");

            closeButton.className = "close-memory";
            closeButton.textContent = "×";

            closeButton.setAttribute(
                "aria-label",
                "Close memory"
            );


            // Close the expanded memory.
            function closeMemory() {

                document.removeEventListener(
                    "keydown",
                    handleEscape
                );

                overlay.remove();

                // Return keyboard focus to the original Polaroid.
                if (
                    previousFocus &&
                    previousFocus.isConnected
                ) {
                    previousFocus.focus();
                }

            }


            // Close when Escape is pressed.
            function handleEscape(event) {

                if (event.key === "Escape") {
                    closeMemory();
                }

            }


            closeButton.addEventListener(
                "click",
                closeMemory
            );

            details.appendChild(closeButton);


            // Display the expanded photograph.
            if (memory.image_path) {

                const photo = document.createElement("img");

                photo.src = memory.image_path;
                photo.alt = memory.title || "Hawaii memory";
                photo.className = "expanded-photo";

                details.appendChild(photo);

            }


            // Display the memory title.
            const title = document.createElement("h2");

            title.textContent =
                memory.title || "Untitled Memory";

            details.appendChild(title);


            // Display the date if available.
            if (memory.memory_date) {

                const date = document.createElement("p");

                date.textContent = memory.memory_date;

                details.appendChild(date);

            }


            // Display the location if available.
            if (memory.location) {

                const location = document.createElement("p");

                location.textContent = memory.location;

                details.appendChild(location);

            }


            // Display the description if available.
            if (memory.description) {

                const description =
                    document.createElement("p");

                description.textContent = memory.description;

                details.appendChild(description);

            }


            // Add the expanded memory to the overlay.
            overlay.appendChild(details);

            document.body.appendChild(overlay);


            // Close when clicking outside the memory.
            overlay.addEventListener("click", event => {

                if (event.target === overlay) {
                    closeMemory();
                }

            });


            // Listen for the Escape key.
            document.addEventListener(
                "keydown",
                handleEscape
            );

            // Move keyboard focus to the close button.
            closeButton.focus();

        }


        // Load existing memories when the page opens.
        loadMemories();

    </script>

</body>

</html>
