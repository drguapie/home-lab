<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Time in Hawaii</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Our Time in Hawaii</h1>
        <p>A collection of memories from our time living on the islands.</p>
    </header>

    <main>

        <!-- Public scrapbook gallery -->
        <section>
            <h2>Memories</h2>

            <div id="memories"></div>
        </section>

    </main>

    <script>

        // Retrieve memories from the Flask API.
        async function loadMemories() {

            const memoriesContainer =
                document.getElementById("memories");

            try {

                const response = await fetch("/api/memories");

                if (!response.ok) {
                    throw new Error("Failed to load memories");
                }

                const data = await response.json();

                // Clear existing memories before displaying new ones.
                memoriesContainer.replaceChildren();

                data.memories.forEach(memory => {

                    // Create the Polaroid frame.
                    const memoryElement =
                        document.createElement("div");

                    memoryElement.className = "polaroid";
                    memoryElement.tabIndex = 0;

                    memoryElement.setAttribute("role", "button");

                    memoryElement.setAttribute(
                        "aria-label",
                        "Open memory: " + (memory.title || "Untitled Memory")
                    );

                    // Display only the photograph on the scrapbook.
                    if (memory.image_path) {

                        const photo =
                            document.createElement("img");

                        photo.src = memory.image_path;
                        photo.alt = memory.title || "Hawaii memory";
                        photo.className = "memory-image";

                        memoryElement.appendChild(photo);

                    } else {

                        const placeholder =
                            document.createElement("div");

                        placeholder.className = "photo-placeholder";
                        placeholder.textContent = "No photograph";

                        memoryElement.appendChild(placeholder);
                    }

                    // Open the expanded memory when clicked.
                    memoryElement.addEventListener("click", () => {
                        openMemory(memory);
                    });

                    // Allow keyboard users to open memories.
                    memoryElement.addEventListener("keydown", event => {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();
                            openMemory(memory);
                        }
                    });

                    memoriesContainer.appendChild(memoryElement);

                });

            } catch (error) {

                console.error("Failed to load memories:", error);

                memoriesContainer.textContent =
                    "Unable to load memories. Please try again later.";
            }
        }


        // Open a memory in an expanded overlay.
        function openMemory(memory) {

            const overlay = document.createElement("div");
            overlay.className = "memory-overlay";

            const details = document.createElement("div");
            details.className = "memory-details";

            details.setAttribute("role", "dialog");
            details.setAttribute("aria-modal", "true");

            details.setAttribute(
                "aria-label",
                memory.title || "Memory details"
            );

            // Remember which element was selected before opening.
            const previousFocus = document.activeElement;

            // Create the close button.
            const closeButton = document.createElement("button");

            closeButton.className = "close-memory";
            closeButton.textContent = "×";

            closeButton.setAttribute(
                "aria-label",
                "Close memory"
            );


            // Close the expanded memory.
            function closeMemory() {

                document.removeEventListener(
                    "keydown",
                    handleEscape
                );

                overlay.remove();

                // Return keyboard focus to the original Polaroid.
                if (
                    previousFocus &&
                    previousFocus.isConnected
                ) {
                    previousFocus.focus();
                }
            }


            // Close when Escape is pressed.
            function handleEscape(event) {

                if (event.key === "Escape") {
                    closeMemory();
                }
            }


            closeButton.addEventListener(
                "click",
                closeMemory
            );

            details.appendChild(closeButton);


            // Display the expanded photograph.
            if (memory.image_path) {

                const photo = document.createElement("img");

                photo.src = memory.image_path;
                photo.alt = memory.title || "Hawaii memory";
                photo.className = "expanded-photo";

                details.appendChild(photo);
            }


            // Display the memory title.
            const title = document.createElement("h2");

            title.textContent =
                memory.title || "Untitled Memory";

            details.appendChild(title);


            // Display the date if available.
            if (memory.memory_date) {

                const date = document.createElement("p");

                date.textContent = memory.memory_date;

                details.appendChild(date);
            }


            // Display the location if available.
            if (memory.location) {

                const location = document.createElement("p");

                location.textContent = memory.location;

                details.appendChild(location);
            }


            // Display the description if available.
            if (memory.description) {

                const description =
                    document.createElement("p");

                description.textContent = memory.description;

                details.appendChild(description);
            }


            // Add the expanded memory to the overlay.
            overlay.appendChild(details);

            document.body.appendChild(overlay);


            // Close when clicking outside the memory.
            overlay.addEventListener("click", event => {

                if (event.target === overlay) {
                    closeMemory();
                }
            });


            // Listen for the Escape key.
            document.addEventListener(
                "keydown",
                handleEscape
            );

            // Move keyboard focus to the close button.
            closeButton.focus();
        }


        // Load existing memories when the page opens.
        loadMemories();

    </script>

</body>

</html>
